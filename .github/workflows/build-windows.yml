name: Build & Release Windows EXE

on:
  push:
    branches: [main, master]
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-2025

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install root dependencies
        run: npm install

      - name: Install backend dependencies
        working-directory: backend
        run: npm install

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_URL: http://localhost:5000/api
        run: |
          npm install
          npm run build

      # On a version tag (v1.0.1, v1.0.2 …) → publish to GitHub Releases
      # electron-builder uploads the .exe + latest.yml so clients auto-update
      - name: Package & Publish (release tag)
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish always

      # On normal pushes → just build, no publish
      - name: Package only (branch push)
        if: "!startsWith(github.ref, 'refs/tags/v')"
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npx electron-builder --win --publish never

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: nexora-pos-windows-${{ github.sha }}
          path: dist-electron/*.exe
          if-no-files-found: error
